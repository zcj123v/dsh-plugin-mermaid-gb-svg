<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-label="Mermaid 流程图转 GB/T 1526-1989 国标 SVG 对比">
<rect width="1280" height="860" fill="#ffffff"/>
<text x="44" y="62" font-family="SimHei, '黑体', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="bold" fill="#111111">Mermaid 流程图 → 国标流程图 SVG</text>
<text x="44" y="100" font-family="'Microsoft YaHei', sans-serif" font-size="18" fill="#555555">按 GB/T 1526-1989 图形符号绘制（等同采用 ISO 5807）· 正交走线每线 ≤3 转折 · 超 A4/A3 自动分页</text>
<rect x="44" y="114" width="86" height="4" fill="#c0392b"/>
<rect x="44" y="235" width="470" height="390" rx="10" fill="#1e2229"/>
<rect x="44" y="235" width="470" height="34" rx="10" fill="#2b313a"/>
<rect x="44" y="259" width="470" height="10" fill="#2b313a"/>
<circle cx="66" cy="252" r="6" fill="#e06c75"/>
<circle cx="88" cy="252" r="6" fill="#e5c07b"/>
<circle cx="110" cy="252" r="6" fill="#98c379"/>
<text x="136" y="257" font-family="Consolas, Menlo, monospace" font-size="14" fill="#9aa4b2">属性配置流程.mmd</text>
<text x="66" y="299" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">graph TD;</text>
<text x="66" y="327" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    A((开始)) --&gt; B[创建Properties对象];</text>
<text x="66" y="355" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    B --&gt; C{遍历列表模型};</text>
<text x="66" y="383" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    C -- 是 --&gt; D[添加目录路径到属性];</text>
<text x="66" y="411" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    D --&gt; C;</text>
<text x="66" y="439" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    C -- 否 --&gt; E{尝试打开配置文件};</text>
<text x="66" y="467" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    E -- 是 --&gt; F[保存属性到文件];</text>
<text x="66" y="495" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    F --&gt; G((结束));</text>
<text x="66" y="523" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    E -- 否 --&gt; H[显示错误信息];</text>
<text x="66" y="551" xml:space="preserve" font-family="Consolas, Menlo, monospace" font-size="16" fill="#d7dae0">    H --&gt; G;</text>
<text x="66" y="609" font-family="'Microsoft YaHei', sans-serif" font-size="14" fill="#7f8896">输入：一段 Mermaid 源码，或一个含 mermaid 代码块的 .md</text>
<path d="M522,430 H566" stroke="#c0392b" stroke-width="4" fill="none"/>
<polygon points="566,421 566,439 584,430" fill="#c0392b"/>
<text x="547" y="412" text-anchor="middle" font-family="'Microsoft YaHei', sans-serif" font-size="15" fill="#c0392b">转换</text>
