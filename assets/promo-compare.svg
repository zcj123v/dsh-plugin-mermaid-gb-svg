<text x="858.6666666666666" y="784" font-family="'Microsoft YaHei', sans-serif" font-size="14" fill="#777777">A4/A3 分页 + 图框 + 异地连接符</text>
<text x="640" y="844" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#999999">dsh plugin --profile web add dsh-plugin-mermaid-gb-svg</text>
